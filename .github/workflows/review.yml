name: Build and review
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode clean verify
      - run: java -jar selfai-code-review-sdk/target/selfai-code-review-sdk-1.0.jar --summary
      - name: Run configured model review
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        env:
          CHATGLM_APIKEYSECRET: ${{ secrets.CHATGLM_APIKEYSECRET }}
          CHATGLM_APIHOST: ${{ vars.CHATGLM_APIHOST || secrets.CHATGLM_APIHOST }}
          CHATGLM_MODEL: ${{ vars.CHATGLM_MODEL }}
          GITHUB_REVIEW_LOG_URI: ${{ secrets.CODE_REVIEW_LOG_URI }}
          GITHUB_TOKEN: ${{ secrets.CODE_TOKEN }}
          WEIXIN_APPID: ${{ secrets.WEIXIN_APPID }}
          WEIXIN_SECRET: ${{ secrets.WEIXIN_SECRET }}
          WEIXIN_TOUSER: ${{ secrets.WEIXIN_TOUSER }}
          WEIXIN_TEMPLATE_ID: ${{ secrets.WEIXIN_TEMPLATE_ID }}
          COMMIT_PROJECT: ${{ github.repository }}
          COMMIT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$CHATGLM_APIKEYSECRET" ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            export COMMIT_AUTHOR="$(git log -1 --format=%an)"
            export COMMIT_MESSAGE="$(git log -1 --format=%s)"
            java -jar selfai-code-review-sdk/target/selfai-code-review-sdk-1.0.jar
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: review
          path: review.md
